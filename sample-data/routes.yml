# Segment names should match Strava exactly; strava_segment_id makes them link.
# IDs below are from Zwift Insider's segment pages — verify on Strava before
# copying into the real routes.yml.
- id: watopia-hilly
  platform: zwift
  world: Watopia
  name: Hilly Route
  info: { name: Zwift Insider, url: "https://zwiftinsider.com/route/hilly-route/" }
  laps_default: 1
  segments:
    lap: { name: Hilly Loop, strava_segment_id: null, start_m: null, end_m: null }
    kom: { name: Hilly KOM, strava_segment_id: 12109030, start_m: null, end_m: null }
    sprint: { name: JWB Sprint, strava_segment_id: 12109305, start_m: null, end_m: null }
- id: watopia-figure-8
  platform: zwift
