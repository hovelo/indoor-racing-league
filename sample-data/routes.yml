# Segment names should match Strava exactly; strava_segment_id makes them link.
# distance_km and elevation_m are optional, shown on event pages (per lap for lapped routes).
# start/end are [lat, lon] for the FIT fallback. See "Adding a route" in 06-data-formats.md.
- id: watopia-hilly
  platform: zwift
  world: Watopia
  name: Hilly Route
  distance_km: 9.3       # per lap
  elevation_m: 109
  info: { name: Zwift Insider, url: "https://zwiftinsider.com/route/hilly-route/" }
  laps_default: 1
  segments:
    lap: { name: Hilly Loop, strava_segment_id: null, start: null, end: null }
    kom: { name: Hilly KOM, strava_segment_id: 12109030, start: [-11.63794, 166.95583], end: [-11.64046, 166.95786] }
    sprint: { name: Sprint Forward, strava_segment_id: 12109305, start: [-11.6491, 166.94939], end: [-11.64724, 166.94925] }
